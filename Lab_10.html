
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-teal-50 text-teal-950">

    <!-- Header -->
    <header class="bg-teal-950 text-teal-50 shadow-md p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">MyStore</h1>
            <span class="text-xs bg-teal-800/70 px-2.5 py-1 rounded-full font-medium">Verified Store</span>
        </div>
    </header>

    <!-- Products -->
    <div class="p-4 sm:p-8">
        <h2 class="text-2xl font-bold text-center text-teal-950 mb-6">Our Products</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 max-w-5xl mx-auto">

            <!-- Product 1 -->
            <div class="bg-white border border-teal-100 rounded-xl p-4 shadow-sm hover:shadow-md transition">
                <img src="https://placehold.co/300x200/ecfdf5/065f46?text=Laptop" class="w-full rounded-lg mb-3">
                <h3 class="text-lg font-semibold text-teal-950">Laptop</h3>
                <p class="text-teal-700 font-bold text-lg mt-1">₹45,999</p>
                <button class="bg-teal-700 hover:bg-teal-800 text-white font-medium p-2.5 mt-3 w-full rounded-lg transition duration-200">
                    Buy Now
                </button>
            </div>

            <!-- Product 2 -->
            <div class="bg-white border border-teal-100 rounded-xl p-4 shadow-sm hover:shadow-md transition">
                <img src="https://placehold.co/300x200/ecfdf5/065f46?text=Mobile" class="w-full rounded-lg mb-3">
                <h3 class="text-lg font-semibold text-teal-950">Mobile</h3>
                <p class="text-teal-700 font-bold text-lg mt-1">₹19,999</p>
                <button class="bg-teal-700 hover:bg-teal-800 text-white font-medium p-2.5 mt-3 w-full rounded-lg transition duration-200">
                    Buy Now
                </button>
            </div>

            <!-- Product 3 -->
            <div class="bg-white border border-teal-100 rounded-xl p-4 shadow-sm hover:shadow-md transition">
                <img src="https://placehold.co/300x200/ecfdf5/065f46?text=Shoes" class="w-full rounded-lg mb-3">
                <h3 class="text-lg font-semibold text-teal-950">Shoes</h3>
                <p class="text-teal-700 font-bold text-lg mt-1">₹2,499</p>
                <button class="bg-teal-700 hover:bg-teal-800 text-white font-medium p-2.5 mt-3 w-full rounded-lg transition duration-200">
                    Buy Now
                </button>
            </div>

            <!-- Product 4 -->
            <div class="bg-white border border-teal-100 rounded-xl p-4 shadow-sm hover:shadow-md transition">
                <img src="https://placehold.co/300x200/ecfdf5/065f46?text=Watch" class="w-full rounded-lg mb-3">
                <h3 class="text-lg font-semibold text-teal-950">Watch</h3>
                <p class="text-teal-700 font-bold text-lg mt-1">₹3,499</p>
                <button class="bg-teal-700 hover:bg-teal-800 text-white font-medium p-2.5 mt-3 w-full rounded-lg transition duration-200">
                    Buy Now
                </button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-teal-950 text-teal-200 text-center p-5 text-sm mt-8">
        MyStore © 2026. All rights reserved.
    </footer>

</body>
</html>
