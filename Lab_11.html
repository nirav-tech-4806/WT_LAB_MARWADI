
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header and Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-teal-50">

    <!-- Header -->
    <header class="bg-teal-950 text-teal-50 p-4 shadow-md">

        <div class="max-w-5xl mx-auto flex justify-between items-center">

            <!-- Logo -->
            <h1 class="text-2xl font-bold tracking-tight">MyStore</h1>

            <!-- Navigation -->
            <nav class="flex gap-6 font-medium">

                <a href="#" class="hover:text-teal-300 transition duration-200">Home</a>

                <a href="#" class="hover:text-teal-300 transition duration-200">About</a>

                <!-- Dropdown -->
                <div class="relative group">

                    <button class="hover:text-teal-300 transition duration-200">
                        Products ▾
                    </button>

                    <div class="hidden group-hover:block absolute bg-white text-teal-950 p-2 w-36 rounded-lg shadow-lg border border-teal-100 z-50">

                        <a href="#" class="block p-2 rounded hover:bg-teal-50 hover:text-teal-600 transition">
                            Laptop
                        </a>

                        <a href="#" class="block p-2 rounded hover:bg-teal-50 hover:text-teal-600 transition">
                            Mobile
                        </a>

                        <a href="#" class="block p-2 rounded hover:bg-teal-50 hover:text-teal-600 transition">
                            Shoes
                        </a>

                    </div>
                </div>

                <a href="#" class="hover:text-teal-300 transition duration-200">Contact</a>

            </nav>

        </div>

    </header>

</body>
</html>
